[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "basic-chat-model"
version = "0.1.0"
description = "A basic chat application that interacts with LLMs through IBM watsonx.ai"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Nikhit Adusumilli"}
]
dependencies = [
    "ibm-watsonx-ai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
chat = "chat_model.main:main"

[tool.setuptools.packages.find]
where = ["src"]
